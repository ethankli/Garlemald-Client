[package]
name = "garlemald-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Cross-platform launcher for Final Fantasy XIV 1.x private servers"
license = "MIT"

[dependencies]
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
quick-xml = { version = "0.36", features = ["serialize"] }
directories = "5"
crc32fast = "1"
flate2 = "1"
blowfish = "0.9"
cipher = "0.4"
base64 = "0.22"
ureq = { version = "2", features = ["tls"] }
object = { version = "0.36", features = ["read"] }
parking_lot = "0.12"
tempfile = "3"

eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.28"
rfd = "0.14"

wry = "0.44"
tao = "0.30"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
    "Win32_System_ProcessStatus",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
