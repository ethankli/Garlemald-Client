# Garlemald launcher starter preferences (localhost defaults).
#
# Read on first launch when no per-user preferences file exists yet
# (platform-specific, e.g. ~/.config/garlemald-client/preferences.toml on
# Linux / macOS). After the user presses "Save" in the UI, their preferences
# file at the platform path takes precedence and this file is no longer
# consulted.
#
# The address below matches the sibling garlemald-server's localhost defaults
# (lobby binds to 127.0.0.1:54994; world to :54992; map to :1989). The
# Windows game client learns ports from hardcoded values; only the lobby
# host gets patched into the PE binary at launch time, so only `server_*`
# is surfaced here.

[launcher]
server_name = "Localhost"
server_address = "127.0.0.1"
# game_location, wine_runtime_dir, patch_download_dir are left unset so the
# platform auto-detection runs. Add them here if you want to hardcode the
# paths (they will otherwise be filled in by the UI on first save).
